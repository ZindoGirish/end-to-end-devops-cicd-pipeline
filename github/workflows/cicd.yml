
name: CICD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn package --file pom.xml

      - name: Trivy Filesystem Scan
        run: trivy fs --format table -o trivy-fs-report.txt .

      - name: Check SonarScanner dependencies
        run: |
          echo "Current user:"
          whoami
          echo "PATH:"
          echo "$PATH"
          echo "unzip location:"
          command -v unzip
          echo "unzip version:"
          unzip -v | head -n 2

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=boardgame

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardgame
          path: target/*.jar
          
      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is empty"
            exit 1
          fi
          echo "Both Docker Hub secrets are available."


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:latest .

      - name: Trivy Image Scan
        run: trivy image --format table -o trivy-image-report.txt ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:latest

    
      - name: Configure kubectl
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment-service.yaml -n webapps
          kubectl get svc -n webapps

  
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trivy-Reports
          path: |
            trivy-fs-report.txt
            trivy-image-report.txt
          if-no-files-found: ignore
